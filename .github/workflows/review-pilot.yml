name: Review pilot (advisory)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to observe (does not request an AI review)
        required: true
        type: string

# No model API key, comment writes, status writes or PR checkout. Never make this required.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: review-pilot-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # All events, including fork reviews, execute only the trusted default-branch collector.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check pilot activation
        id: activation
        run: |
          if test -f scripts/review/pilot.py; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Pilot not installed on the default branch. No review observation was made.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Observe configured reviewer
        if: steps.activation.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/review/pilot.py --event "$GITHUB_EVENT_PATH"
          --output .local/review-pilot/receipt.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.activation.outputs.active == 'true'
        with:
          name: review-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/review-pilot/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
