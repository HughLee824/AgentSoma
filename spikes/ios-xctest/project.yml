name: AgentSomaSpike
options:
  bundleIdPrefix: com.somnus.agentsoma.spike
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Fixture:
    type: application
    platform: iOS
    sources: [Fixture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somnus.agentsoma.spike.fixture
        INFOPLIST_KEY_CFBundleDisplayName: AgentSoma Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AgentSomaTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Fixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somnus.agentsoma.spike.tests
        TEST_TARGET_NAME: Fixture
schemes:
  AgentSomaSpike:
    build:
      targets:
        Fixture: all
        AgentSomaTests: [test]
    test:
      targets: [AgentSomaTests]
      parallelizable: false
