name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: swift test
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: node --test scripts/tests/test_agent_templates.mjs
      - name: Compile the iPhone Runner without signing
        run: |
          xcodebuild build-for-testing \
            -project Runner/AgentSomaRunner.xcodeproj -scheme AgentSomaRunner \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ci-runner \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=17.0
      - name: Check and package the self-contained client plugin
        run: |
          python3 scripts/sync-plugin.py --check
          python3 scripts/sync-plugin.py --archive .build/plugins
      - name: Build the static website
        run: python3 website/build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-access
          if-no-files-found: error
          retention-days: 7
          path: |
            website/dist/
            .build/plugins/*.zip
            .build/plugins/*.zip.sha256
